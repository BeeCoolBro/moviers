<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untitled document - Google Docs</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" id="gdIcon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 64'%3E%3Cpath d='M4 0h28l16 16v44a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4z' fill='%234285f4'/%3E%3Cpath d='M32 0l16 16H36a4 4 0 0 1-4-4z' fill='%23a1c2fa'/%3E%3Cpath d='M12 30h24v4H12zm0 8h24v4H12zm0 8h16v4H12z' fill='%23fff'/%3E%3C/svg%3E">
<style>html,body{margin:0;height:100%;background:#05060c;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#05060c}
#gd{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:#f9fbfd;color:#1f1f1f;font:14px/1.4 "Google Sans",Roboto,Arial,sans-serif;user-select:none}
#gd.gd-off{display:none}
#gd svg{width:20px;height:20px;fill:#444746;display:block}
.gd-top{display:flex;align-items:center;gap:8px;padding:8px 16px 0 12px;background:#f9fbfd}
.gd-logo{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
.gd-logo svg{width:24px!important;height:32px!important}
.gd-mid{flex:1;min-width:0}
.gd-name{display:flex;align-items:center;gap:6px}
.gd-name b{font-weight:400;font-size:18px;padding:0 6px;border:1px solid transparent;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd-name b:hover{border-color:#747775}
.gd-name svg{width:18px!important;height:18px!important}
.gd-menu{display:flex;gap:2px;margin-left:2px;flex-wrap:nowrap;overflow:hidden}
.gd-menu span{padding:2px 7px;border-radius:4px;cursor:default;white-space:nowrap}
.gd-menu span:hover{background:#e8eaed}
.gd-right{display:flex;align-items:center;gap:14px;flex:none}
.gd-ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.gd-ico:hover{background:#e8eaed}
.gd-share{display:flex;align-items:center;gap:8px;background:#c2e7ff;color:#001d35;border-radius:24px;padding:0 20px 0 16px;height:40px;font-weight:500}
.gd-share svg{fill:#001d35!important;width:18px!important;height:18px!important}
.gd-av{width:32px;height:32px;border-radius:50%;background:#7b1fa2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500}
.gd-tools{display:flex;align-items:center;gap:2px;margin:6px 16px 4px;padding:3px 8px;background:#edf2fa;border-radius:24px;overflow:hidden;white-space:nowrap;min-height:34px}
.gd-tools>*{flex:none}
.gd-t{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#444746}
.gd-t:hover{background:#dde3ea}
.gd-dd{padding:0 6px;height:28px;display:flex;align-items:center;gap:4px;border-radius:4px;color:#444746}
.gd-dd:hover{background:#dde3ea}
.gd-dd:after{content:"";border:4px solid transparent;border-top:5px solid #444746;margin-top:5px}
.gd-sep{width:1px;height:20px;background:#c7c7c7;margin:0 5px}
.gd-size{display:flex;align-items:center;gap:2px;color:#444746}
.gd-size i{font-style:normal;border:1px solid #747775;border-radius:4px;padding:1px 6px;min-width:18px;text-align:center}
.gd-ruler{height:22px;margin:0 auto;width:816px;max-width:calc(100% - 32px);background:#fff;border-bottom:1px solid #dadce0;background-image:repeating-linear-gradient(90deg,transparent 0 11px,#bdc1c6 11px 12px);background-size:12px 5px;background-repeat:repeat-x;background-position:0 bottom;flex:none}
.gd-scroll{flex:1;overflow:auto;background:#f9fbfd;border-top:1px solid #c7c7c7;padding:18px 16px 60px}
.gd-page{box-sizing:border-box;width:816px;max-width:100%;min-height:1056px;margin:0 auto;background:#fff;border:1px solid #c7c7c7;box-shadow:0 1px 3px rgba(60,64,67,.15);padding:96px}
#gdText{outline:none;min-height:24px;font:15px/1.5 Arial,sans-serif;color:#000;user-select:text;cursor:text;white-space:pre-wrap;word-wrap:break-word}
@media (max-width:760px){.gd-menu,.gd-hide,.gd-ruler{display:none}.gd-page{padding:48px 24px;min-height:80vh}.gd-share span{display:none}.gd-share{padding:0 12px}.gd-right{gap:6px}}
</style>
</head>
<body>
<div id="gd" aria-label="Untitled document">
  <div class="gd-top">
    <div class="gd-logo"><svg viewBox="0 0 48 64"><path d="M4 0h28l16 16v44a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4z" fill="#4285f4"/><path d="M32 0l16 16H36a4 4 0 0 1-4-4z" fill="#a1c2fa"/><path d="M12 30h24v4H12zm0 8h24v4H12zm0 8h16v4H12z" fill="#fff"/></svg></div>

        <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3s-1.34 3-3 3zm-9-3.82-2.09-2.09L6.5 13.5 10 17l6.01-6.01-1.41-1.41z"/></svg>
      </div>
      <div class="gd-menu"><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Format</span><span>Tools</span><span>Extensions</span><span>Help</span></div>
    </div>
    <div class="gd-right">
      <div class="gd-ico gd-hide"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg></div>
      <div class="gd-ico gd-hide"><svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg></div>
      <div class="gd-share"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg><span>Share</span></div>
      <div class="gd-av">B</div>
    </div>
  </div>
  <div class="gd-tools">
    <div class="gd-t"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></div>
    <div class="gd-t"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></div>
    <div class="gd-t"><svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16a8.002 8.002 0 0 1 7.6-5.5c1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg></div>
    <div class="gd-t gd-hide"><svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg></div>
    <div class="gd-sep"></div>
    <div class="gd-dd">100%</div>
    <div class="gd-sep"></div>
    <div class="gd-dd gd-hide">Normal text</div>
    <div class="gd-sep gd-hide"></div>
    <div class="gd-dd">Arial</div>
    <div class="gd-sep"></div>
    <div class="gd-size"><div class="gd-t">&minus;</div><i>11</i><div class="gd-t">+</div></div>
    <div class="gd-sep"></div>
    <div class="gd-t">B</div>
    <div class="gd-t" style="font-style:italic;font-family:Georgia,serif">I</div>
    <div class="gd-t" style="text-decoration:underline">U</div>
    <div class="gd-t" style="text-decoration:underline 3px #000">A</div>
    <div class="gd-sep gd-hide"></div>
    <div class="gd-t gd-hide"><svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></div>

  </div>

  <div class="gd-scroll"><div class="gd-page"><div id="gdText" contenteditable="true" spellcheck="false"></div></div></div>
</div>
<iframe id="bsFrame" title="BeeSide Studio's" allow="autoplay; fullscreen; clipboard-read; clipboard-write; microphone; camera; display-capture"></iframe>
<script>
/* BeeSide Studio's: the pages load from GitHub and switch in place. */
var PAGES=null;
(function () {
  var f = document.getElementById('bsFrame'), cur = null, want = null;
  function norm(h) {
    h = String(h || '/').split('?')[0].split('#')[0].replace(/\/+$/, '') || '/';
    return h === '/index.html' ? '/' : h;
  }
  function show(route) {
    route = norm(route);
    if (!PAGES) { want = route; if (failed) fetchPages(SRC.length); return; }
    if (!PAGES[route]) route = '/';
    if (route === cur) return;
    cur = route;
    document.title = PAGES[route].t;
    f.srcdoc = PAGES[route].h;
    try { f.focus(); } catch (e) {}
  }
  // the pages call this instead of following a link
  window.BSGO = function (href) {
    var r = norm(href);
    if (PAGES && !PAGES[r]) { window.open(href, '_blank', 'noopener'); return; }
    if (location.hash !== '#' + r) location.hash = r; else show(r);
  };
  f.addEventListener('load', function () { try { f.contentWindow.focus(); } catch (e) {} });
  // cover: a blank doc until "bees" is typed, then the real page loads
  var gd = document.getElementById('gd'), gdText = document.getElementById('gdText'), typed = '';
  function unlock() {
    if (!gd || gd.classList.contains('gd-off')) return;
    window.removeEventListener('keydown', onKey, true);
    gd.classList.add('gd-off');
    gdText.textContent = '';
    document.querySelector('meta[name="theme-color"]').content = '#05060c';
    var ic = document.getElementById('gdIcon'); if (ic) ic.remove();
    show(location.hash.slice(1) || '/');
  }
  function onKey(e) {
    if (!e.key || e.key.length !== 1) return;
    typed = (typed + e.key).slice(-4);
    if (typed.toLowerCase() === 'bees') setTimeout(unlock, 0);
  }
  // keydown for keyboards, input for phones whose keyboards don't report keys
  window.addEventListener('keydown', onKey, true);
  gdText.addEventListener('input', function () {
    if (/bees/i.test(gdText.textContent)) unlock();
  });
  window.addEventListener('hashchange', function () { if (gd.classList.contains('gd-off')) show(location.hash.slice(1)); });
  document.title = 'Untitled document - Google Docs';
  // the pages live in the GitHub repo; fetch and unpack them while the doc is up
  var SRC = [
    'https://raw.githubusercontent.com/BeeCoolBro/moviers/refs/heads/claude/dreamy-brown-x3lj02/bees/pages.json.gz',
    'https://raw.githubusercontent.com/BeeCoolBro/moviers/refs/heads/dev/bees/pages.json.gz',
    'https://cdn.jsdelivr.net/gh/BeeCoolBro/moviers@dev/bees/pages.json.gz'
  ], failed = false;
  function fetchPages(k) {
    if (k >= SRC.length) {
      failed = true;
      if (want !== null) f.srcdoc = '<p style="font:16px sans-serif;color:#ccc;padding:24px">Couldn\'t load the site. Check your connection and reload.</p>';
      return;
    }
    fetch(SRC[k], { cache: 'no-cache' }).then(function (res) {
      if (!res.ok) throw new Error(res.status);
      return new Response(res.body.pipeThrough(new DecompressionStream('gzip'))).json();
    }).then(function (p) {
      PAGES = p;
      if (want !== null) { var r = want; want = null; show(r); }
    }).catch(function () { fetchPages(k + 1); });
  }
  fetchPages(0);
  gdText.focus();
})();
</script>
</body>
